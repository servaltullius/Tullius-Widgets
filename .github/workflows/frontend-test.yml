name: Frontend Lint & Test

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: view/package-lock.json

      - name: Install dependencies
        run: cd view && npm ci

      - name: Lint
        run: cd view && npm run lint

      - name: Type check
        run: cd view && npx tsc -b --noEmit

      - name: Test
        run: cd view && npm run test

      - name: Install browser for browser tests
        run: cd view && npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: cd view && npm run e2e

      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: view/test-results
          retention-days: 7

      - name: Contract tests
        run: node --test scripts/*.test.mjs
